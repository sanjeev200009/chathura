<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS Creative</title>
  </head>
  <body>
    <!-- Hero: designed on a 1896 x 1069 frame; every size below is in those design pixels. -->
    <div id="hero-wrap">
      <section id="hero" aria-label="Hero">
        <h1 id="hero-title">
          <span class="line"><span>FREELANCE</span></span>
          <span class="line"><span>CREATIVE DESIGNER</span></span>
        </h1>

        <img id="portrait" src="/hero/portrait.png" alt="Portrait" width="743" height="775" />

        <img class="tool" id="tool-ai" src="/hero/icon-ai.png" alt="" />
        <img class="tool" id="tool-figma" src="/hero/icon-figma.png" alt="" />
        <img class="tool" id="tool-canva" src="/hero/icon-canva.png" alt="" />
        <img class="tool" id="tool-ps" src="/hero/icon-ps.png" alt="" />

        <svg id="cursor" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
          <path d="M2 2 L20 8 L11.5 11.5 L8 20 Z" fill="#c8f21d" />
        </svg>
        <span id="expert">Expert</span>

        <nav id="nav">
          <a id="logo" href="#">CS CREATIVE</a>
          <ul>
            <li><a href="#">HOME</a></li>
            <li><a href="#">ABOUT US</a></li>
            <li><a href="#">MY SERVICES</a></li>
            <li><a href="#">SELECTED WORK</a></li>
            <li><a href="#">OUR EXPERTISE</a></li>
          </ul>
          <a id="cta" href="#">GET IN TOUCH</a>
        </nav>

        <img id="overlay" alt="" hidden />
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
