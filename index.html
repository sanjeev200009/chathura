<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chathurae</title>
  </head>
  <body class="bg-zinc-950 text-white antialiased">
    <canvas id="scene" class="fixed inset-0 -z-0 h-full w-full"></canvas>

    <main class="relative z-10">
      <section class="flex min-h-screen items-center px-6 md:px-20">
        <div class="max-w-xl">
          <h1 data-reveal class="text-5xl font-bold md:text-7xl">Fast. Smooth. Alive.</h1>
          <p data-reveal class="mt-4 text-lg text-zinc-400">Scroll to move the 3D world.</p>
        </div>
      </section>
      <section class="flex min-h-screen items-center px-6 md:px-20">
        <div class="max-w-xl">
          <h2 data-reveal class="text-4xl font-bold md:text-6xl">Motion that follows you</h2>
          <p data-reveal class="mt-4 text-lg text-zinc-400">Every scroll drives the camera and the object.</p>
        </div>
      </section>
      <section class="flex min-h-screen items-center justify-end px-6 md:px-20">
        <div class="max-w-xl text-right">
          <h2 data-reveal class="text-4xl font-bold md:text-6xl">Built for speed</h2>
          <p data-reveal class="mt-4 text-lg text-zinc-400">Three.js + GSAP ScrollTrigger + Tailwind.</p>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
